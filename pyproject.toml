[project]
name = "braindance"
version = "0.1.0"
description = "Braindance Lab — EEG sleep and emotion state pipeline for Databricks"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23",
  "scipy>=1.10",
  "pandas>=1.5",
]

[project.optional-dependencies]
io = ["mne>=1.6", "openneuro-py>=2023.1"]
ml = ["scikit-learn>=1.3", "mlflow>=2.9"]
dev = ["pytest>=7", "edfio>=0.4", "mne>=1.6", "scikit-learn>=1.3"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
